<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 640 508" role="img" aria-labelledby="title desc">
<title id="title">Remove a redundant constraint, then cut off fractional points</title>
<desc id="desc">Both models use nonnegative integer x1 and x2 with the same objective. The original has x1+x2 at most 2.5 and x1+2x2 at most 6. First remove the redundant second constraint. Nonnegativity implies x1+2x2 is at most twice x1+x2, which is at most 5. This reduces two model rows to one without changing the LP region. Then add the valid cut x1+x2 at most 2 because the sum is integer. It excludes the fractional point (1.5,1) and preserves the same six integer points. The cut replaces the weaker sum constraint. Shared nonnegativity bounds are excluded from row counts. The plot shows the original and compact LP triangle with intercepts 2.5, the tighter triangle with intercepts 2, and the dashed line x1+2x2=6.</desc>
<defs>
 <linearGradient id="original" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfeafa"/><stop offset="1" stop-color="#f0f5fc"/></linearGradient>
 <linearGradient id="tight" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8dfd0"/><stop offset="1" stop-color="#e6f3ed"/></linearGradient>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
 <rect x="16" y="48" width="276" height="132" rx="12" fill="#fff" stroke="#ccdbea"/>
 <rect x="348" y="48" width="276" height="132" rx="12" fill="#f3f9f6" stroke="#9fc7b7"/>
 <text x="36" y="76" font-size="14" font-weight="600" fill="#476d9b">ORIGINAL</text>
 <text x="368" y="76" font-size="14" font-weight="600" fill="#247d70">REFORMULATED</text>
 <g font-family="Georgia, 'Times New Roman', serif" fill="#203952" text-anchor="middle">
  <text x="154" y="114" font-size="26">x₁ + x₂ ≤ 2.5</text>
  <text x="154" y="151" font-size="24" fill="#a27453">x₁ + 2x₂ ≤ 6</text>
  <text x="486" y="125" font-size="29">x₁ + x₂ ≤ 2</text>
 </g>
 <text x="486" y="158" text-anchor="middle" font-size="13" fill="#557e70">Same integer feasible solutions</text>
 <path d="M304 113H336m-6-5 6 5-6 5" fill="none" stroke="#6e8a9b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="320" y="209" text-anchor="middle" font-size="15" fill="#526c80">Shared domains: x₁, x₂ ∈ ℤ,  x₁ ≥ 0,  x₂ ≥ 0</text>
 <!-- Coordinates: origin (66,466), one unit = 68 pixels. -->
 <g stroke="#dce5ec" stroke-width="1">
  <path d="M134 242V466M202 242V466M66 398H285M66 330H285M66 262H285"/>
 </g>
 <path d="M66 466H236L66 296Z" fill="url(#original)" stroke="#7d9fc8" stroke-width="1.8" stroke-linejoin="round"/>
 <path d="M66 466H202L66 330Z" fill="url(#tight)" stroke="#247d70" stroke-width="2" stroke-linejoin="round"/>
 <path d="M66 262L285 371.5" stroke="#b18b6b" stroke-width="1.4" stroke-dasharray="5 4"/>
 <text x="184" y="297" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#9a7458">x₁ + 2x₂ = 6</text>
 <path d="M51 466H289m-6-4 6 4-6 4M66 481V237m-4 6 4-6 4 6" fill="none" stroke="#7c93a6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
 <g font-size="12" fill="#687f93" text-anchor="middle">
  <text x="53" y="482">0</text><text x="134" y="487">1</text><text x="202" y="487">2</text><text x="270" y="487">3</text>
  <text x="52" y="402">1</text><text x="52" y="334">2</text><text x="52" y="266">3</text>
 </g>
 <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#3a5b73"><text x="297" y="472">x₁</text><text x="57" y="228">x₂</text></g>
 <g fill="#203952" stroke="#fff" stroke-width="1.5"><circle cx="66" cy="466" r="5"/><circle cx="66" cy="398" r="5"/><circle cx="66" cy="330" r="5"/><circle cx="134" cy="466" r="5"/><circle cx="134" cy="398" r="5"/><circle cx="202" cy="466" r="5"/></g>
 <path d="m163 393 10 10m0-10-10 10" stroke="#b67c51" stroke-width="2" stroke-linecap="round"/>
 <path d="M174 398H227L245 379" fill="none" stroke="#b67c51" stroke-width="1"/>
 <text x="216" y="368" font-size="12" fill="#9a6948">(1.5, 1)</text>
 <circle cx="354" cy="252" r="11" fill="#e5ecf7"/>
 <text x="354" y="256" text-anchor="middle" font-size="11" fill="#476d9b">1</text>
 <text x="374" y="258" font-size="16" font-weight="600" fill="#476d9b">COMPACT</text>
 <text x="344" y="284" font-size="15" fill="#526c80">Remove the redundant x₁ + 2x₂ ≤ 6</text>
 <text x="344" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#203952">x₁ + 2x₂ ≤ 2(x₁ + x₂) ≤ 5 &lt; 6</text>
 <text x="344" y="335" font-size="13" fill="#657b90">Fewer rows; LP region unchanged.</text>
 <path d="M344 352H615" stroke="#d8e2e8"/>
 <circle cx="354" cy="378" r="11" fill="#deeee6"/>
 <text x="354" y="382" text-anchor="middle" font-size="11" fill="#247d70">2</text>
 <text x="374" y="384" font-size="16" font-weight="600" fill="#247d70">TIGHT</text>
 <text x="344" y="410" font-size="15" fill="#526c80">Add the valid cut x₁ + x₂ ≤ 2:</text>
 <text x="344" y="438" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#203952">x₁ + x₂ ∈ ℤ, so round 2.5 down.</text>
 <text x="344" y="461" font-size="13" fill="#657b90">It also replaces the weaker sum bound.</text>
 <rect x="62" y="506" width="13" height="13" rx="2" fill="#dfeafa" stroke="#7d9fc8"/>
 <text x="84" y="518" font-size="12" fill="#476d9b">Original / compact LP</text>
 <rect x="274" y="506" width="13" height="13" rx="2" fill="#b8dfd0" stroke="#247d70"/>
 <text x="296" y="518" font-size="12" fill="#247d70">Tighter LP</text>
 <circle cx="426" cy="512" r="4" fill="#203952"/>
 <text x="438" y="518" font-size="12" fill="#36576b">Same 6 integer points</text>
</g>
</svg>
